[project]
name = "xbrief"
version = "0.1.0"
description = "A twice-daily brief of what the accounts I follow on X posted, read from my own Following tab"
requires-python = ">=3.12"
# The reading is done by the operator's own Brave over the DevTools protocol; websockets is the one library.
dependencies = [
  "websockets==15.0.1",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --no-header"
